name: CI

# Pushes to main run this workflow through pages.yml, which deploys only after
# it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A called workflow sees its caller's github context, so the group carries the
# caller's name there and never matches the pages group. Only pull requests
# cancel superseded runs; cancelling a called run would skip its deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: No tracked PDFs
        run: ./run check-pdfs

      - name: Install
        run: ./run setup

      - name: Typecheck
        run: ./run typecheck

      - name: Test
        run: ./run test

      - name: Build
        run: ./run build

      - name: Content-Security-Policy in the build
        run: ./run check-csp
