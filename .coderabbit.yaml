# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US

# Under 250 characters — the schema's limit.
tone_instructions: >-
  Name the trigger, the code path, and the user-visible consequence for every
  finding. If you cannot name one, do not raise it. No praise, no preamble, no
  restating the diff. Silence beats a nitpick.

reviews:
  profile: assertive
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false

  high_level_summary_instructions: |
    Write in present tense: "adds", not "added".
    Lead with what changes for a breeder using the site — what they load, see
    or are told — not with the file list. Say so plainly when nothing visible
    changes. Do not restate the PR description back to the author.

  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        A reader who sees only the title should understand what the PR does.
        Conventional-commit form: <type>(<scope>): <subject>, imperative mood.
    # Quoted: bare `off` is a YAML 1.1 boolean, and this field takes a string.
    description:
      mode: "off"

  tools:
    # README and AGENTS.md are deliberate prose with a deliberate voice.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  path_filters:
    # Generated by npm; thousands of resolved URLs and integrity hashes.
    - '!package-lock.json'

  path_instructions:
    - path: '**/*'
      instructions: |
        ## Evidence, not impressions
        Every finding states the trigger, the code path it runs through, and what
        the user sees. A finding you cannot express that way is not one. Say
        plainly when you are unsure rather than hedging an assertion.

        ## Comments
        Comments explain **why the code is the way it is**, usually which
        alternative was rejected and what it would have cost. Do not ask for
        them to be trimmed for brevity. Do flag a comment that narrates a change
        ("fixes X", "we used to Y", "renamed from Z"): every comment must read
        correctly to someone who never saw the diff.

        ## Do not ask for these
        - **A UI framework.** One page with a handful of interactive regions is
          built with plain TypeScript and the DOM, on purpose.
        - **A Makefile or npm scripts.** `./run` is the entry point. Each target
          is `function name {`, a `#@ Description` line, then a `#@ Category: X`
          line, in that order — the help text is generated by walking the file
          with awk.
        - **A backend, an upload, or any server-side step.** The site's promise
          is that reports never leave the browser. Anything that sends report
          content, or anything derived from it, off the page breaks that
          promise, whatever it is for.
        - **A CDN, hosted fonts, or analytics.** The page makes no third-party
          requests, and the Content-Security-Policy enforces it.
        - **A CHANGELOG.** There has never been one.

        ## Scope
        One logical change per PR. Flag substantial unrelated work and suggest a
        separate PR; a called-out trivial fly-by fix is fine. Do not ask for
        refactoring of code the PR merely touches.

    - path: 'src/**'
      instructions: |
        The page reads PDFs supplied by whoever opens it. **Every string derived
        from a PDF is untrusted.** It reaches the DOM through `textContent` or
        text nodes only. Flag any `innerHTML`, `outerHTML`,
        `insertAdjacentHTML`, `document.write`, HTML template strings, or an
        attribute set from PDF text where the attribute is a URL or an event
        handler — even when the value looks like it came from a fixed column of
        the report, because a crafted PDF controls every column.

        **Nothing is saved.** Flag any write of report content, or anything
        derived from it, to `localStorage`, `sessionStorage`, IndexedDB,
        cookies, the Cache API or the URL. A breeder is told that closing the
        page discards the reports.

        **No network.** Flag `fetch`, `XMLHttpRequest`, `WebSocket`,
        `sendBeacon`, or an image or link whose URL carries report data.

    - path: '{vite.config.ts,scripts/csp-check.ts}'
      instructions: |
        The Content-Security-Policy is a meta tag because GitHub Pages cannot set
        response headers; it is defence in depth behind text-only insertion. It
        is written out twice on purpose: `vite.config.ts` injects it and
        `scripts/csp-check.ts` states it independently, so the build check
        fails when the injected policy drifts. Do not suggest importing one from
        the other.

        Flag any loosening: `'unsafe-inline'`, `'unsafe-eval'`,
        `'wasm-unsafe-eval'`, `blob:` or `data:` outside `img-src`, wildcards,
        or a third-party origin. Each needs a stated reason in the PR. The
        policy must stay build-only, because the Vite dev server injects inline
        scripts, and the meta tag must precede every script, link and style
        element, because a meta policy does not govern what loads before it.

    - path: '.github/**'
      instructions: |
        The workflows are hardened and should stay that way. Flag a third-party
        Action referenced by tag or branch instead of a full commit SHA with a
        version comment, `pull_request_target`, permissions wider than the job
        needs (`contents: read` at workflow level; `pages: write` and
        `id-token: write` only on the deploy job), `npm install` instead of
        `npm ci`, and a step that runs something other than `./run` without a
        reason.

    - path: 'tests/**'
      instructions: |
        **Judge whether a test can fail.** Value tests that fail when the
        production change is reverted. Flag assertions on source text, on a
        stub's recorded intent rather than on observable state, and on internals
        an equivalent implementation would change.

        Watch for three verification anti-patterns: a fixture that sits wholly
        inside the thing under test, so the comparison runs the same code twice;
        a test that reimplements the logic it checks and compares it against
        itself; and a comparison that passes when both sides find nothing.

        Committed fixtures carry synthetic identifiers only — no real dog's
        name, microchip, registration number, kit ID or owner. Flag anything
        that looks like a real one. A PDF must never be committed.

    - path: '**/*.md'
      instructions: |
        Documentation describes the current state. Flag implementation-status
        language ("Step 3", "TODO", "currently implemented as"), build
        narratives, and unchecked checklist items.

        **A rule's justification is not development history.** "Insert PDF text
        with `textContent` only — a crafted report controls every column" is one
        sentence of rule and one of evidence, and the evidence is what stops the
        rule being optimised away by someone who thinks it is fussiness. Keep
        those. Flag narrative that no rule depends on: what was tried in which
        order, what a previous pass cleaned up, how the current state came
        about.

        This repository is **public**. Flag detail that identifies our own
        infrastructure (host names, addresses, filesystem paths, usernames) and
        anything that identifies a real dog or its owner. Breed names, gene
        names and variant codes are ordinary subject matter.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
